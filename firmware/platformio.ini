; PlatformIO Project Configuration File
;
; esp32c3-lab firmware — exposes Nordic UART Service over BLE,
; speaks the maqueen-style ASCII command vocabulary, drives the
; Robot-01 v3 hardware (TB6612FNG motors · servos · NeoPixels ·
; HC-SR04 · buzzer).

[platformio]
; Sketch lives in ./esp32c3-lab/  so that Arduino IDE's "folder name
; must match .ino name" rule is satisfied. PlatformIO follows the same
; folder via src_dir below.
src_dir = esp32c3-lab

[env:esp32-c3-devkitm-1]
; Pinned to ESP-IDF 5.1 — fixes the FastLED RMT ISR recursion bug
; documented in 01_robot_1's audit BUG-001.
platform = espressif32 @ 6.7.0
board    = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_flags =
    -D FASTLED_RMT_MAX_CHANNELS=1     ; ESP32-C3 has only 2 RMT channels
    -D FASTLED_RMT_BUILTIN_DRIVER=1   ; use IDF's tested RMT driver
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D ARDUINO_USB_CDC_ON_BOOT=1      ; native USB CDC console
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    fastled/FastLED       @ ^3.7.0
    madhephaestus/ESP32Servo
